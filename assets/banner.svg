<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="260" viewBox="0 0 1000 260">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/><stop offset="0.55" stop-color="#1e3a8a"/><stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/><stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#ffffff" stroke-opacity="0.06"/>
    </pattern>
  </defs>
  <rect width="1000" height="260" rx="20" fill="url(#bg)"/>
  <rect width="1000" height="260" rx="20" fill="url(#grid)"/>
  <!-- regression decoration -->
  <g transform="translate(600 30)">
    <line x1="30" y1="190" x2="370" y2="190" stroke="#fff" stroke-opacity="0.35" stroke-width="2"/>
    <line x1="30" y1="190" x2="30" y2="10" stroke="#fff" stroke-opacity="0.35" stroke-width="2"/>
    <line x1="45" y1="165" x2="355" y2="35" stroke="url(#line)" stroke-width="5" stroke-linecap="round"/>
    <g fill="#fbbf24" stroke="#fff" stroke-width="1.5">
      <circle cx="65" cy="170" r="7"/><circle cx="120" cy="140" r="7"/><circle cx="170" cy="125" r="7"/>
      <circle cx="225" cy="95" r="7"/><circle cx="270" cy="85" r="7"/><circle cx="315" cy="52" r="7"/>
      <circle cx="350" cy="40" r="7"/>
    </g>
  </g>
  <text x="50" y="95" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="46" font-weight="800" fill="#ffffff">Simple Linear</text>
  <text x="50" y="148" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="46" font-weight="800" fill="url(#line)">Regression</text>
  <text x="50" y="185" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" fill="#cbd5e1">with scikit-learn  ·  Experience → Salary</text>
  <text x="50" y="225" font-family="Consolas, monospace" font-size="20" fill="#fde68a">h(x) = θ₀ + θ₁ · x</text>
</svg>
