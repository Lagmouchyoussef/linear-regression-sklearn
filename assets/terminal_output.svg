<svg xmlns="http://www.w3.org/2000/svg" width="860" height="888" viewBox="0 0 860 888">
  <rect width="860" height="888" rx="12" fill="#0f172a"/>
  <rect width="860" height="40" rx="12" fill="#1e293b"/>
  <rect y="28" width="860" height="12" fill="#1e293b"/>
  <circle cx="24" cy="20" r="7" fill="#ef4444"/><circle cx="46" cy="20" r="7" fill="#f59e0b"/><circle cx="68" cy="20" r="7" fill="#10b981"/>
  <text x="430.0" y="25" text-anchor="middle" fill="#94a3b8" font-family="Consolas, Menlo, monospace" font-size="13">python main.py</text>
  <g xml:space="preserve" font-family="Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="13">
    <text x="26" y="64" fill="#10b981">$ python main.py</text>
    <text x="26" y="104" fill="#38bdf8">Data:</text>
<text x="26" y="124" fill="#e2e8f0">   Experience  Salary</text>
<text x="26" y="144" fill="#e2e8f0">0           1      22</text>
<text x="26" y="164" fill="#e2e8f0">1           2      27</text>
<text x="26" y="184" fill="#e2e8f0">2           3      34</text>
<text x="26" y="204" fill="#e2e8f0">3           4      40</text>
<text x="26" y="224" fill="#e2e8f0">4           5      45</text>
<text x="26" y="244" fill="#e2e8f0">5           6      52</text>
<text x="26" y="264" fill="#e2e8f0">6           7      57</text>
<text x="26" y="284" fill="#e2e8f0"> </text>
<text x="26" y="304" fill="#38bdf8">Optimal parameters:</text>
<text x="26" y="324" fill="#a7f3d0">theta0 (intercept) = 15.857</text>
<text x="26" y="344" fill="#a7f3d0">theta1 (slope) = 5.929</text>
<text x="26" y="364" fill="#a7f3d0">Equation: h(x) = 15.857 + 5.929 * x</text>
<text x="26" y="384" fill="#fde68a">Prediction for 3.5 years of experience: 36.6 kDH</text>
<text x="26" y="404" fill="#e2e8f0"> </text>
<text x="26" y="424" fill="#38bdf8">Model evaluation:</text>
<text x="26" y="444" fill="#a7f3d0">MSE = 0.224</text>
<text x="26" y="464" fill="#a7f3d0">J(theta) = MSE / 2 = 0.112</text>
<text x="26" y="484" fill="#a7f3d0">R^2 = 0.998</text>
<text x="26" y="504" fill="#e2e8f0"> </text>
<text x="26" y="524" fill="#e2e8f0">Graph displayed with plt.show()</text>
<text x="26" y="544" fill="#fde68a">Prediction for 10 years of experience: 75.1 kDH</text>
<text x="26" y="564" fill="#e2e8f0">This forecast is an extrapolation and is less reliable than a prediction within the range of</text>
<text x="26" y="584" fill="#e2e8f0">the training data.</text>
<text x="26" y="604" fill="#e2e8f0"> </text>
<text x="26" y="624" fill="#38bdf8">Gradient descent (SGDRegressor):</text>
<text x="26" y="644" fill="#a7f3d0">eta0 = 0.0001 -&gt; theta0 ≈ 12.192, theta1 ≈ 6.668</text>
<text x="26" y="664" fill="#a7f3d0">eta0 = 0.01 -&gt; theta0 ≈ 15.859, theta1 ≈ 5.903</text>
<text x="26" y="684" fill="#a7f3d0">eta0 = 0.1 -&gt; theta0 ≈ 14.846, theta1 ≈ 5.365</text>
<text x="26" y="704" fill="#e2e8f0"> </text>
<text x="26" y="724" fill="#38bdf8">Comparison with the analytical method (eta0 = 0.01):</text>
<text x="26" y="744" fill="#a7f3d0">theta0 (SGD) = 15.859 ; theta0 (analytical) = 15.857</text>
<text x="26" y="764" fill="#a7f3d0">theta1 (SGD) = 5.903 ; theta1 (analytical) = 5.929</text>
<text x="26" y="784" fill="#e2e8f0">The difference comes from the fact that gradient descent uses an iterative approximation, while</text>
<text x="26" y="804" fill="#e2e8f0">the analytical method gives the exact solution for a simple linear problem.</text>
<text x="26" y="824" fill="#e2e8f0">Gradient descent is particularly useful when the number of parameters is very large, because</text>
<text x="26" y="844" fill="#e2e8f0">analytical resolution becomes expensive or impossible.</text>
  </g>
</svg>